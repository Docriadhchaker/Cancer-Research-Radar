<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">Cancer Research Radar — system architecture</title>
  <desc id="desc">Architecture flow from a user oncology query through an API gateway, biomedical data providers, research aggregation, normalization and provenance, research directions, and the Dashboard, Radar, and Evidence Explorer outputs. Runtime data modes and source traceability are shown.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.5" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0d1930"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(260 180) rotate(25) scale(560 420)">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(1350 760) rotate(160) scale(580 460)">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="0.5" stop-color="#12304b"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="direction" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5eead4"/>
    </marker>
    <marker id="traceArrow" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94a3b8" stroke-width="0.6" opacity="0.07"/>
    </pattern>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { fill: #5eead4; font-size: 13px; font-weight: 700; letter-spacing: 2.8px; }
      .title { fill: #f8fafc; font-size: 38px; font-weight: 760; letter-spacing: -1.1px; }
      .subtitle { fill: #94a3b8; font-size: 16px; font-weight: 450; }
      .section { fill: #64748b; font-size: 12px; font-weight: 700; letter-spacing: 2.3px; }
      .node-title { fill: #f8fafc; font-size: 17px; font-weight: 700; }
      .node-copy { fill: #9fb0c6; font-size: 13px; font-weight: 450; }
      .small { fill: #94a3b8; font-size: 11px; font-weight: 500; }
      .micro { fill: #7f91aa; font-size: 10px; font-weight: 600; letter-spacing: 0.4px; }
      .badge { font-size: 10px; font-weight: 800; letter-spacing: 0.8px; }
      .output-title { fill: #e2e8f0; font-size: 15px; font-weight: 700; }
      .output-copy { fill: #8293aa; font-size: 11px; }
      .metric { fill: #dbeafe; font-size: 11px; font-weight: 650; }
    </style>
  </defs>

  <rect width="1600" height="1180" rx="30" fill="url(#bg)"/>
  <rect width="1600" height="1180" rx="30" fill="url(#grid)"/>
  <rect width="1600" height="1180" rx="30" fill="url(#glowA)"/>
  <rect width="1600" height="1180" rx="30" fill="url(#glowB)"/>
  <rect x="1" y="1" width="1598" height="1178" rx="29" fill="none" stroke="#334155" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(80 62)">
    <g transform="translate(0 0)">
      <circle cx="23" cy="23" r="22" fill="#0f2937" stroke="#2dd4bf" stroke-opacity="0.55"/>
      <circle cx="23" cy="23" r="12" fill="none" stroke="#5eead4" stroke-width="2" opacity="0.9"/>
      <path d="M23 23 L23 12 A11 11 0 0 1 32.5 28.5 Z" fill="url(#brand)" opacity="0.95"/>
      <circle cx="23" cy="23" r="3.2" fill="#f8fafc"/>
    </g>
    <text x="64" y="13" class="eyebrow">CANCER RESEARCH RADAR</text>
    <text x="64" y="49" class="title">From biomedical evidence to research direction</text>
    <text x="64" y="77" class="subtitle">A source-grounded pipeline for mapping where oncology research is moving.</text>
  </g>

  <!-- Runtime mode legend at top -->
  <g transform="translate(1152 68)">
    <rect width="368" height="76" rx="16" fill="#0f1d31" stroke="#27364e"/>
    <text x="18" y="23" class="micro">RUNTIME DATA MODE</text>
    <g transform="translate(18 36)">
      <rect width="90" height="25" rx="12.5" fill="#0d3b36" stroke="#2dd4bf" stroke-opacity="0.55"/>
      <circle cx="14" cy="12.5" r="4" fill="#34d399"/>
      <text x="25" y="16" class="badge" fill="#6ee7b7">LIVE</text>
      <rect x="98" width="116" height="25" rx="12.5" fill="#3d2e13" stroke="#f59e0b" stroke-opacity="0.55"/>
      <circle cx="112" cy="12.5" r="4" fill="#fbbf24"/>
      <text x="123" y="16" class="badge" fill="#fcd34d">PARTIAL</text>
      <rect x="222" width="100" height="25" rx="12.5" fill="#263247" stroke="#64748b" stroke-opacity="0.65"/>
      <circle cx="236" cy="12.5" r="4" fill="#94a3b8"/>
      <text x="247" y="16" class="badge" fill="#cbd5e1">DEMO</text>
    </g>
  </g>

  <!-- Section 1: Query and gateway -->
  <text x="80" y="192" class="section">01 · REQUEST &amp; ORCHESTRATION</text>
  <g filter="url(#shadow)">
    <rect x="80" y="214" width="420" height="94" rx="18" fill="#101f33" stroke="#2d415b"/>
    <rect x="80" y="214" width="5" height="94" rx="2.5" fill="#2dd4bf"/>
    <circle cx="126" cy="261" r="21" fill="#12313b" stroke="#2dd4bf" stroke-opacity="0.55"/>
    <circle cx="126" cy="253" r="6" fill="none" stroke="#99f6e4" stroke-width="2"/>
    <path d="M115 273c1.8-8 20.2-8 22 0" fill="none" stroke="#99f6e4" stroke-width="2" stroke-linecap="round"/>
    <text x="163" y="251" class="node-title">User Query</text>
    <text x="163" y="276" class="node-copy">Cancer · biomarker · stage · geography</text>
    <rect x="381" y="233" width="96" height="24" rx="12" fill="#162a3c" stroke="#334155"/>
    <text x="429" y="249" text-anchor="middle" class="micro" fill="#a5f3fc">STRUCTURED</text>

    <rect x="608" y="214" width="912" height="94" rx="18" fill="url(#core)" stroke="#3b82f6" stroke-opacity="0.5"/>
    <rect x="608" y="214" width="5" height="94" rx="2.5" fill="#60a5fa"/>
    <circle cx="654" cy="261" r="21" fill="#172c50" stroke="#60a5fa" stroke-opacity="0.65"/>
    <path d="M643 254h22M643 261h22M643 268h14" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round"/>
    <text x="691" y="250" class="node-title">Server / API Gateway</text>
    <text x="691" y="275" class="node-copy">Validates the cohort, fans out provider calls, resolves cache and data mode</text>
    <g transform="translate(1218 231)">
      <rect width="272" height="58" rx="12" fill="#0b1c32" stroke="#365070"/>
      <text x="16" y="22" class="micro">MODE RESOLVER</text>
      <text x="16" y="42" class="small" fill="#c7d2fe">availability + freshness + fallbacks</text>
    </g>
  </g>
  <path d="M500 261H600" fill="none" stroke="#5eead4" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Main flow spine -->
  <path d="M800 308V348" fill="none" stroke="#5eead4" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Section 2: Providers -->
  <text x="80" y="359" class="section">02 · PROVIDER LAYER</text>
  <g filter="url(#shadow)">
    <!-- ClinicalTrials -->
    <g transform="translate(80 380)">
      <rect width="330" height="140" rx="18" fill="#101e31" stroke="#2e4561"/>
      <circle cx="30" cy="30" r="15" fill="#103c38"/>
      <path d="M30 20v20M20 30h20" stroke="#6ee7b7" stroke-width="2.4" stroke-linecap="round"/>
      <text x="56" y="28" class="node-title">ClinicalTrials.gov</text>
      <text x="56" y="50" class="small">Studies · sites · phases · status</text>
      <rect x="232" y="17" width="78" height="23" rx="11.5" fill="#0d3b36" stroke="#2dd4bf" stroke-opacity="0.5"/>
      <circle cx="246" cy="28.5" r="3.5" fill="#34d399"/>
      <text x="258" y="32" class="badge" fill="#6ee7b7">LIVE</text>
      <path d="M20 72H310" stroke="#24364d"/>
      <text x="20" y="94" class="micro">TRACE KEYS</text>
      <text x="20" y="116" class="small" fill="#b5c5d8">NCT ID · source URL · retrieved_at</text>
    </g>

    <!-- CCWAI -->
    <g transform="translate(450 380)">
      <rect width="330" height="140" rx="18" fill="#101e31" stroke="#2e4561"/>
      <circle cx="30" cy="30" r="15" fill="#143552"/>
      <path d="M22 35c4-12 12-12 16 0M22 25c4 12 12 12 16 0" fill="none" stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round"/>
      <text x="56" y="24" class="node-title">Cure Cancer</text>
      <text x="56" y="45" class="node-title">With AI</text>
      <rect x="232" y="17" width="78" height="23" rx="11.5" fill="#0d3b36" stroke="#2dd4bf" stroke-opacity="0.5"/>
      <circle cx="246" cy="28.5" r="3.5" fill="#34d399"/>
      <text x="258" y="32" class="badge" fill="#6ee7b7">LIVE</text>
      <path d="M20 72H310" stroke="#24364d"/>
      <text x="20" y="94" class="micro">TRACE KEYS</text>
      <text x="20" y="116" class="small" fill="#b5c5d8">PMID · DOI · journal · source URL</text>
    </g>

    <!-- PubMed future -->
    <g transform="translate(820 380)">
      <rect width="330" height="140" rx="18" fill="#0e1a2b" stroke="#334155" stroke-dasharray="7 6"/>
      <circle cx="30" cy="30" r="15" fill="#2b3040"/>
      <path d="M22 21h11a5 5 0 0 1 5 5v15H27a5 5 0 0 0-5 5z" fill="none" stroke="#a5b4fc" stroke-width="1.8" stroke-linejoin="round"/>
      <text x="56" y="28" class="node-title" fill="#d5dce8">PubMed</text>
      <text x="56" y="50" class="small">Direct literature ingestion</text>
      <rect x="222" y="17" width="88" height="23" rx="11.5" fill="#292b46" stroke="#818cf8" stroke-opacity="0.45"/>
      <text x="266" y="32" text-anchor="middle" class="badge" fill="#a5b4fc">FUTURE</text>
      <path d="M20 72H310" stroke="#24364d"/>
      <text x="20" y="94" class="micro">PLANNED SIGNAL</text>
      <text x="20" y="116" class="small">MeSH · publication type · citations</text>
    </g>

    <!-- OpenFDA future -->
    <g transform="translate(1190 380)">
      <rect width="330" height="140" rx="18" fill="#0e1a2b" stroke="#334155" stroke-dasharray="7 6"/>
      <circle cx="30" cy="30" r="15" fill="#2b3040"/>
      <path d="M22 30h16M30 22v16" stroke="#c4b5fd" stroke-width="2.2" stroke-linecap="round"/>
      <text x="56" y="28" class="node-title" fill="#d5dce8">openFDA</text>
      <text x="56" y="50" class="small">Approvals · labels · indications</text>
      <rect x="222" y="17" width="88" height="23" rx="11.5" fill="#292b46" stroke="#818cf8" stroke-opacity="0.45"/>
      <text x="266" y="32" text-anchor="middle" class="badge" fill="#a5b4fc">FUTURE</text>
      <path d="M20 72H310" stroke="#24364d"/>
      <text x="20" y="94" class="micro">PLANNED SIGNAL</text>
      <text x="20" y="116" class="small">Application no. · label · approval date</text>
    </g>
  </g>

  <!-- Provider fan-in lines -->
  <path d="M245 520V548H800" fill="none" stroke="#334c69" stroke-width="1.6"/>
  <path d="M615 520V548H800" fill="none" stroke="#334c69" stroke-width="1.6"/>
  <path d="M985 520V548H800" fill="none" stroke="#334c69" stroke-width="1.6" stroke-dasharray="5 5"/>
  <path d="M1355 520V548H800" fill="none" stroke="#334c69" stroke-width="1.6" stroke-dasharray="5 5"/>
  <path d="M800 548V575" fill="none" stroke="#5eead4" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Section 3: Evidence engine -->
  <text x="80" y="584" class="section">03 · EVIDENCE ENGINE</text>
  <g filter="url(#shadow)">
    <rect x="80" y="604" width="430" height="118" rx="20" fill="url(#core)" stroke="#60a5fa" stroke-opacity="0.52"/>
    <circle cx="125" cy="648" r="22" fill="#102d4a" stroke="#60a5fa" stroke-opacity="0.55"/>
    <circle cx="119" cy="644" r="5" fill="#7dd3fc"/>
    <circle cx="133" cy="640" r="4" fill="#5eead4"/>
    <circle cx="131" cy="655" r="5" fill="#a5b4fc"/>
    <path d="M123 642l6-1M122 648l6 5M133 644l-1 7" stroke="#dbeafe" stroke-width="1.5"/>
    <text x="165" y="642" class="node-title">Research Aggregator</text>
    <text x="165" y="666" class="node-copy">Parallel retrieval · caching · resilience</text>
    <text x="165" y="690" class="small">One cohort, many evidence domains</text>

    <rect x="620" y="604" width="900" height="118" rx="20" fill="#111f32" stroke="#38bdf8" stroke-opacity="0.45"/>
    <circle cx="665" cy="648" r="22" fill="#103044" stroke="#38bdf8" stroke-opacity="0.52"/>
    <path d="M655 638h20v20h-20zM660 643h10M660 648h10M660 653h6" fill="none" stroke="#bae6fd" stroke-width="1.7" stroke-linecap="round"/>
    <text x="705" y="640" class="node-title">Normalization &amp; Provenance</text>
    <text x="705" y="665" class="node-copy">Maps every provider to one common evidence model</text>
    <g transform="translate(1045 625)">
      <rect width="448" height="76" rx="13" fill="#0a192c" stroke="#294663"/>
      <text x="16" y="22" class="micro" fill="#7dd3fc">SOURCE TRACEABILITY · PRESERVED END TO END</text>
      <text x="16" y="46" class="metric">source</text>
      <text x="66" y="46" class="small">·</text>
      <text x="78" y="46" class="metric">source_id</text>
      <text x="148" y="46" class="small">·</text>
      <text x="160" y="46" class="metric">retrieved_at</text>
      <text x="245" y="46" class="small">·</text>
      <text x="257" y="46" class="metric">evidence_url</text>
      <path d="M16 59H420" stroke="#1e4864" stroke-dasharray="3 4"/>
    </g>
  </g>
  <path d="M510 663H612" fill="none" stroke="#5eead4" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M800 722V758" fill="none" stroke="#5eead4" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Section 4: Research directions -->
  <text x="80" y="767" class="section">04 · SYNTHESIS LAYER</text>
  <g filter="url(#shadow)">
    <rect x="250" y="787" width="1100" height="126" rx="22" fill="url(#direction)" stroke="#818cf8" stroke-opacity="0.62"/>
    <circle cx="310" cy="850" r="31" fill="#1c2d5d" stroke="#a5b4fc" stroke-opacity="0.62"/>
    <circle cx="310" cy="850" r="18" fill="none" stroke="#5eead4" stroke-width="1.5" opacity="0.7"/>
    <path d="M310 850V832A18 18 0 0 1 327 856Z" fill="url(#brand)"/>
    <circle cx="310" cy="850" r="4" fill="#fff"/>
    <text x="365" y="832" class="node-title" style="font-size:20px">Research Directions</text>
    <text x="365" y="860" class="node-copy" style="font-size:14px">Clusters converging evidence into interpretable themes—without hiding uncertainty</text>
    <g transform="translate(365 876)">
      <rect width="130" height="24" rx="12" fill="#132d4c" stroke="#3b82f6" stroke-opacity="0.45"/>
      <text x="65" y="16" text-anchor="middle" class="micro" fill="#93c5fd">MOMENTUM</text>
      <rect x="140" width="130" height="24" rx="12" fill="#14353f" stroke="#2dd4bf" stroke-opacity="0.45"/>
      <text x="205" y="16" text-anchor="middle" class="micro" fill="#5eead4">MATURITY</text>
      <rect x="280" width="130" height="24" rx="12" fill="#2b2a4c" stroke="#818cf8" stroke-opacity="0.45"/>
      <text x="345" y="16" text-anchor="middle" class="micro" fill="#c4b5fd">CONFIDENCE</text>
    </g>
    <g transform="translate(1040 813)">
      <rect width="278" height="74" rx="14" fill="#10213a" stroke="#40547a"/>
      <text x="18" y="24" class="micro">GROUNDED OUTPUT</text>
      <path d="M18 37h160" stroke="#2b4b68"/>
      <circle cx="22" cy="54" r="3.5" fill="#5eead4"/>
      <text x="34" y="58" class="small" fill="#c4d3e7">Each direction cites its evidence</text>
    </g>
  </g>
  <path d="M800 913V948" fill="none" stroke="#5eead4" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Section 5: Experience layer -->
  <text x="80" y="957" class="section">05 · EXPERIENCE LAYER</text>
  <g filter="url(#shadow)">
    <g transform="translate(170 978)">
      <rect width="380" height="112" rx="18" fill="#101e31" stroke="#31506c"/>
      <rect x="22" y="21" width="56" height="56" rx="13" fill="#123344" stroke="#2dd4bf" stroke-opacity="0.38"/>
      <rect x="34" y="35" width="8" height="29" rx="3" fill="#2dd4bf"/>
      <rect x="47" y="43" width="8" height="21" rx="3" fill="#60a5fa"/>
      <rect x="60" y="29" width="8" height="35" rx="3" fill="#818cf8"/>
      <text x="96" y="43" class="output-title">Dashboard</text>
      <text x="96" y="65" class="output-copy">Cohort overview &amp; key signals</text>
      <text x="22" y="96" class="micro" fill="#5eead4">WHAT IS HAPPENING?</text>
    </g>

    <g transform="translate(610 978)">
      <rect width="380" height="112" rx="18" fill="#101e31" stroke="#40558b"/>
      <rect x="22" y="21" width="56" height="56" rx="13" fill="#202a50" stroke="#818cf8" stroke-opacity="0.42"/>
      <circle cx="50" cy="49" r="18" fill="none" stroke="#818cf8" stroke-width="1.4" opacity="0.8"/>
      <path d="M50 49V31A18 18 0 0 1 67 55Z" fill="#818cf8" opacity="0.8"/>
      <circle cx="50" cy="49" r="4" fill="#e0e7ff"/>
      <text x="96" y="43" class="output-title">Radar</text>
      <text x="96" y="65" class="output-copy">Momentum, maturity &amp; convergence</text>
      <text x="22" y="96" class="micro" fill="#a5b4fc">WHERE IS RESEARCH MOVING?</text>
    </g>

    <g transform="translate(1050 978)">
      <rect width="380" height="112" rx="18" fill="#101e31" stroke="#31506c"/>
      <rect x="22" y="21" width="56" height="56" rx="13" fill="#123344" stroke="#38bdf8" stroke-opacity="0.4"/>
      <path d="M36 34h28v30H36zM42 42h16M42 49h16M42 56h10" fill="none" stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round"/>
      <text x="96" y="43" class="output-title">Evidence Explorer</text>
      <text x="96" y="65" class="output-copy">Inspect every source behind a claim</text>
      <text x="22" y="96" class="micro" fill="#7dd3fc">WHY SHOULD I TRUST IT?</text>
    </g>
  </g>

  <!-- Traceability rail -->
  <path d="M1493 665V1034Q1493 1046 1481 1046H1438" fill="none" stroke="#7dd3fc" stroke-width="1.4" stroke-dasharray="4 5" marker-end="url(#traceArrow)" opacity="0.68"/>
  <g transform="translate(1477 914) rotate(-90)">
    <rect x="-10" y="-15" width="160" height="26" rx="13" fill="#0b1b2e" stroke="#23435e"/>
    <text x="70" y="2" text-anchor="middle" class="micro" fill="#7dd3fc">TRACEABLE BY DESIGN</text>
  </g>

  <!-- Footer -->
  <g transform="translate(80 1132)">
    <circle cx="7" cy="0" r="7" fill="#2dd4bf" opacity="0.18" filter="url(#softGlow)"/>
    <circle cx="7" cy="0" r="3.5" fill="#5eead4"/>
    <text x="24" y="5" class="small" fill="#a8b8cc">Evidence in. Direction out. Every insight remains linked to its source.</text>
    <text x="1440" y="5" text-anchor="end" class="micro">ARCHITECTURE · v1</text>
  </g>
</svg>
